<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi´s Studio</title>
    <link rel="stylesheet" href="..\css\style.css">
</head>

<!--Corpo do Site-->

<body>

    <!--Cabeçalho-->
    <header>
        <h1>Studio de Yoga e Pilates</h1>

        <!--Navegação-->
        <nav>
             <figure>
                <img src="..\imgs\logosemf.png" width="300px" title="logo do estúdio">
                </figure>
                    <a href="index.html">Inicio</a>
                    <a href="inscricao.html">Pré Inscrição</a>
                    <a href="contato.html">Contato</a>
                    <a href="precos.html">Preços</a>
                    <a href="login.html">Login Para Alunos</a>

        </nav>
    </header>
    <main>

     <!--seção do formulario-->
        <section>
            <h2>Faça sua Pré Inscrição</h2>
            <form>
                <fieldset>
                    <!--Dados Pessoais-->
                    <legend>Dados Pessoais</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                    <br>
                    <label for="nome">Sobrenome:</label>
                    <input type="text" id="nome" name="nome" required>
                    <br>
                    <label for="nome">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="aluno@aluno.com.br" required>
                    <br>
                    <label for="nome">Confirme seu Email:</label>
                    <input type="email" id="email" name="email" minlength="8" maxlength="10"
                        placeholder="Minimo 8 caracters">
                    <br>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" minlength="8" maxlength="10"
                        placeholder="Minimo 8 caracters" title="Regras: Minímo 8 e maximo 12 Caracteres">
                    <br>
                    <label for="senha">Confirme sua Senha:</label>
                    <input type="password" id="senha" name="senha" minlength="8" maxlength="10"
                        placeholder="Minimo 8 caracters">
                    <br>
                    <label for="idade">Idade: </label><input type="number" id="idade" name="idade" min="0" max="120"
                        step="1">
                    <br>
                    <label for="data">Data de nascimento:</label>
                    <input type="date" id="data" name="data">
                    <br>
                    <label for="cpf">CPF:</label>
                    <input type="numero" id="numero" min="1" max="100" name="numero" required>
                    <br>
                    <label for="tel">Telefone:</label>
                    <input type="numero" id="numero" name="numero">
                    <br>
                    <label for="cel">WhatsApp:</label>
                    <input type="numero" id="numero" name="numero" required>
                    <br>
                    </fieldset>

                    <!--endereço-->
                    <fieldset>
                        <legend>Endereço</legend>
                        <label for="nome">CEP:</label>
                        <input type="text" id="endereco" name="endereco" required>
                        <br>
                        <label for="nome">Endereço Completo:</label>
                        <input type="text" id="endereco" name="endereco" required>
                        <br>
                        <label for="nome">Cidade::</label>
                        <input type="text" id="endereco" name="endereco" required>
                        <br>
                        <label for="nome">Estado:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </fieldset>

                    
                    <fieldset>
                        <legend>Atestado de Aptidão Física</legend>
                        <label>Anexe seu Atestado:</label><br />
                        <input type="file" id="arquivo" name="arquivo">
                        <br>
                    </fieldset>
                  
                    <fieldset>
                        <legend>Escolha sua Atividade:</legend>
                        <label>
                            <input type="checkbox" name="atividade" value="atividade" required>
                           Yoga
                        </label>
                        <label>
                            <input type="checkbox" name="atividade" value="atividade">
                            Pilates
                        </label>
                        <br>
                        <label>
                            <input type="radio" name="curso" value="curso" required>
                            Manhã
                        </label>
                        <label>
                            <input type="radio" name="curso" value="curso">
                            Tarde
                        </label>
                         <label>
                            <input type="radio" name="curso" value="curso" required>
                            Noite
                        </label>
                        </fieldset>
                        <br>
                <label for="mensagem">
                    Mensagem:
                </label><br>
                <textarea id="mensagem" name="mensagem" rows="10" cols="40"></textarea>

                <br>
                    <br>
                    <button class="butao" type="submit">
                        Enviar
                    </button>
                    <button class="butao" type="reset">
                        Limpar
                    </button>
                   

            </form>

 </main>

    <footer>
        <p>&copy; 2026 Chibi´s Studio. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
